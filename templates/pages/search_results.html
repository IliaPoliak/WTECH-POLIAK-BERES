<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../config.js"></script>
    <script src="../utils.js"></script>
    <script>
      loadBasePath(BASE_PATH);
    </script>

    <link rel="stylesheet" href="layout/layout.css" />
    <link rel="stylesheet" href="variables.css" />
    <link rel="stylesheet" href="pages/shop_pages.css" />
    <title>Search Results</title>
  </head>
  <body>
    <div id="header"></div>

    <div class="main-content">
      <div id="sidebar"></div>

        <section class="search-results-grid">

          <a href="pages/product-detail.html">
            <article class="product-card">

          <a href="pages/product-detail.html">
            <article class="product-card">
              <h3>Tmavomodré tričko</h3>
              <img src="assets/blue_t_shirt.png" alt="Product Photo"></img>
              <p>24,99€</p>
            </article>
          </a>
        </section>
      </main>
    </div>

    <div id="footer"></div>

    <script>
      loadComponent("header", "layout/header.html");
      loadComponent("sidebar", "layout/sidebar.html");
      loadComponent("footer", "layout/footer.html");
    </script>
