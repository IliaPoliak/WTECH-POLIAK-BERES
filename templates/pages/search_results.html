<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../config.js"></script>
    <script src="../utils.js"></script>
    <script>
      loadBasePath(BASE_PATH);
    </script>

    <link rel="stylesheet" href="layout/layout.css" />
    <link rel="stylesheet" href="variables.css" />

  <body>
    <div id="header"></div>

    <div class="main-content">
      <div id="sidebar"></div>

      <main class="search-results-page">
        <div class="search-results-top">
          <h1>Výsledky vyhľadávania</h1>
          <p>Výsledok pre: <strong>Modré tričko</strong></p>
        </div>

        <section class="search-results-grid">
          <a href="pages/product-detail.html" class="search-result-card">

          <a href="pages/product-detail.html" class="search-result-card">
            <div class="search-result-top">
              <h2>Svetlomodré tričko</h2>
              <span>19,99€</span>
            </div>

          </a>

          <a href="pages/product-detail.html" class="search-result-card">
            <div class="search-result-top">
              <h2>Tmavomodré tričko</h2>
              <span>24,99€</span>
            </div>
            <div class="search-result-color">Tmavomodrá</div>
            <div class="search-result-image">Fotka produktu</div>
          </a>
        </section>
      </main>
    </div>

    <div id="footer"></div>

    <script>
      loadComponent("header", "layout/header.html");
      loadComponent("sidebar", "layout/sidebar.html");
      loadComponent("footer", "layout/footer.html");
    </script>

</html>
