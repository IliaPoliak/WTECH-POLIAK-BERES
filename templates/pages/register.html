<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../layout.css" />
    <title>3čko</title>
  </head>
  <body>
    <div id="header"></div>

    <div class="main-content">
      <div id="sidebar"></div>

      <main>
        <div class="register-page">
          <h1>Registrácia</h1>

          <div class="register-form">
            <div class="form-row">
              <label for="register-name">Meno</label>
              <input type="text" id="register-name" />
            </div>

            <div class="form-row">
              <label for="register-surname">Priezvisko</label>
              <input type="text" id="register-surname" />
            </div>

            <div class="form-row form-row-wide">
              <label for="register-email">e-mail</label>
              <input type="email" id="register-email" />
            </div>

            <div class="form-row">
              <label for="register-password">Heslo</label>
              <input type="password" id="register-password" />
            </div>
          </div>

          <a href="#" class="register-submit-button">Registrovať sa</a>
        </div>
      </main>
    </div>
  </body>
  <script>
    async function loadComponent(id, file) {
      const res = await fetch(file);
      document.getElementById(id).innerHTML = await res.text();
    }

    loadComponent("header", "../header.html");
    loadComponent("sidebar", "../sidebar.html");
  </script>
</html>

<style>
  main {
    text-align: center;
  }
</style>
