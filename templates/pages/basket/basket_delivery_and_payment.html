<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="../../utils.js"></script>

  <link rel="stylesheet" href="../../layout/layout.css" />
  <link rel="stylesheet" href="../../variables.css" />
  <link rel="stylesheet" href="basket_pages.css" />
  <title>3čko</title>
</head>

<body>
<header class="header">
  <h1 class="logo"><a href="../index.html">3čko</a></h1>

  <div class="header-inner">
    <nav class="nav hover-underline">
      <a href="../auth/login.html">Prihlasenie</a>
      <div>|</div>
      <a href="../auth/register.html">Registracia</a>
    </nav>

    <div class="header-inner-right">
      <form action="../search_results.html">
        <input class="searchbar" type="text" placeholder="vyhladat..." />
      </form>
      <button class="basket-button">
        <a href="basket.html">Kosik🧺</a>
      </button>
    </div>
  </div>
</header>

<header class="header2">
  <div class="header2-inner-left">
    <button onclick="toggle_sidebar()">&nbsp;☰&nbsp;</button>
    <button>
      <a href="../auth/login.html">👤</a>
    </button>
  </div>

  <h1 class="logo"><a href="../index.html">3čko</a></h1>

  <div class="header2-inner-right">
    <button onclick="toggle_searchbar()">🔍</button>
    <button>
      <a href="basket.html">🛒</a>
    </button>
  </div>
</header>

<div class="search2">
  <form action="../search_results.html">
    <input type="text" placeholder="vyhladat..." />
  </form>
</div>

<div class="main-content">
  <aside class="sidebar">
    <ul class="category-selection hover-underline">
      <li><a href="../category_pages/category(Tricka).html">Tričká</a></li>
      <li><a href="../category_pages/category(Mikiny).html">Mikiny</a></li>
      <li><a href="../category_pages/category(Ciapky).html">Čiapky</a></li>
    </ul>

    <nav class="sidebar-nav hover-underline">
      <a href="../index.html">O nas</a>
      <a href="../index.html">Recenzie</a>
      <a href="../index.html">Reklamacia</a>
      <a href="../index.html">Kontakt</a>
    </nav>
  </aside>

  <main class="basket-step-page">
    <div class="basket-step-top">
      <a class="basket-step-back-left" href="basket.html">
        ↩ späť na prehľad košíka
      </a>

      <a class="basket-step-back-right" href="../index.html">
        ↩ späť na prehliadanie
      </a>
    </div>

    <section class="basket-step-content">
      <h1>Doprava a platba</h1>

      <div class="basket-option-group">
        <h2>Vyberte spôsob platby</h2>

        <label class="basket-option">
          <input type="radio" name="payment" />
          <span>platba kartou</span>
        </label>

        <label class="basket-option">
          <input type="radio" name="payment" />
          <span>dobierka</span>
        </label>
      </div>

      <div class="basket-option-group">
        <h2>Vyberte spôsob dopravy</h2>

        <label class="basket-option">
          <input type="radio" name="delivery" />
          <span>osobné vyzdvihnutie</span>
        </label>

        <label class="basket-option">
          <input type="radio" name="delivery" />
          <span>kurierska spoločnosť</span>
        </label>

        <label class="basket-option">
          <input type="radio" name="delivery" />
          <span>poštou</span>
        </label>
      </div>

      <div class="basket-step-bottom">
        <a class="basket-step-next-btn" href="basket_address.html">
          Pokračovať k adrese
        </a>
      </div>
    </section>
  </main>
</div>
</body>
</html>

<style>
  @media (max-width: 770px) {
    .basket-step-top {
      flex-direction: column;
      gap: 10px;
    }

    .basket-step-back-right {
      width: 264px;
    }
  }
</style>
