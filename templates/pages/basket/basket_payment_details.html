<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="../../config.js"></script>
  <script src="../../utils.js"></script>
  <script>
    loadBasePath(BASE_PATH);
  </script>
  <link rel="stylesheet" href="layout/layout.css" />
  <link rel="stylesheet" href="variables.css" />
  <link rel="stylesheet" href="pages/basket/basket_pages.css" />
  <title>3čko</title>
</head>
<body>
<div id="header"></div>

<div class="main-content">
  <div id="sidebar"></div>

  <main class="basket-step-page">
    <div class="basket-step-top">
      <a class="basket-step-back-left" href="pages/basket/basket_address.html">
        ↩ zmeniť spôsob platby
      </a>

      <a class="basket-step-back-right" href="pages/index.html">
        ↩ späť na prehliadávanie
      </a>
    </div>

    <section class="basket-step-content">
      <h1>Platobné údaje</h1>

      <form class="basket-payment-form">
        <div class="basket-form-row">
          <label for="card-number">číslo karty</label>
          <input id="card-number" type="text" />
        </div>

        <div class="basket-form-row basket-expiration-row">
          <label for="exp-month">Dátum expirácie</label>
          <div class="basket-expiration-inputs">
            <input id="exp-month" type="text" />
            <input id="exp-year" type="text" />
          </div>
        </div>

        <div class="basket-form-row basket-form-row-short">
          <label for="cvv">cvv</label>
          <input id="cvv" type="text" />
        </div>
      </form>

      <div class="basket-step-bottom">
        <a class="basket-step-next-btn" href="pages/basket/basket_thank_you.html">
          Dokončiť nákup
        </a>
      </div>
    </section>
  </main>
</div>

<div id="footer"></div>

<script>
  loadComponent("header", "layout/header.html");
  loadComponent("sidebar", "layout/sidebar.html");
  loadComponent("footer", "layout/footer.html");
</script>
</body>
</html>
